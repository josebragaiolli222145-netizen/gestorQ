<!-- ═══════════════════════════════════════════════════════════════════
     GestorQ v51 — melhorias da análise de mercado
     Fase 1: Painel de hoje (KPIs acionáveis), cabeçalho enxuto com menu do
             usuário, marca única "GestorQ", paleta unificada no tema escuro,
             rebaixa sugerida + destino dos produtos + "R$ salvos".
     Fase 2: página Indicadores — perda x faturamento com meta e benchmark
             Abrappe, motivos (Pareto), relatório para Compras, pendências
             (5W2H existente) com foto de evidência, histórico de destinos.
     Fase 3: leitura de código GS1 (validade/lote), ação corretiva obrigatória
             na temperatura, "Minha lista de hoje" por função, navegação
             agrupada / barra inferior com botão Escanear, modo chão de loja,
             importação de faturamento e de leituras de sensores.
     Tudo é aditivo: usa os mesmos dados do app (vencidosData, acoesPlano,
     tempLog, perdas v42) e guarda o que é novo em chaves gq51_*.
     ═══════════════════════════════════════════════════════════════════ -->
